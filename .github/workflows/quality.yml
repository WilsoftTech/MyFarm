name: Phase 1 quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: myfarm
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: myfarm_phase01_test
        ports: ["55431:5432"]
        options: --health-cmd "pg_isready -U myfarm" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://myfarm:isolated-ci-password@127.0.0.1:55431/myfarm_phase01_test
      DIRECT_URL: postgresql://myfarm:isolated-ci-password@127.0.0.1:55431/myfarm_phase01_test
      TEST_DATABASE_URL: postgresql://myfarm:isolated-ci-password@127.0.0.1:55431/myfarm_phase01_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:boundaries
      - run: npm test
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: test-results/
