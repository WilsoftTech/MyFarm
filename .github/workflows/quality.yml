name: MyFarm quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: myfarm
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: myfarm_phase01_test
        ports: ["55431:5432"]
        options: --health-cmd "pg_isready -U myfarm" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://myfarm:isolated-ci-password@127.0.0.1:55431/myfarm_phase01_test
      DIRECT_URL: postgresql://myfarm:isolated-ci-password@127.0.0.1:55431/myfarm_phase01_test
      TEST_DATABASE_URL: postgresql://myfarm:isolated-ci-password@127.0.0.1:55431/myfarm_phase01_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:boundaries
      - run: npm test
      - run: npm run db:migrate
      - run: npm run test:integration
      - name: Non-UTC stock and accounting verification
        run: npm run test:integration -- tests/integration/harvest-service.test.ts tests/integration/poultry-production.test.ts tests/integration/stock-operations.test.ts tests/integration/stock-reconstruction.test.ts tests/integration/farm-accounting-service.test.ts
        env:
          TZ: Africa/Nairobi
      - run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Stock recovery rehearsal
        run: node tests/support/phase05-recovery.mjs
        env:
          MYFARM_TEST_CONTAINER: ${{ job.services.postgres.id }}
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build signed-in fixture application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3211
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: fixture-publishable-key
      - name: Signed-in desktop and mobile acceptance
        run: npm run test:e2e -- --config playwright.production.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: test-results/
